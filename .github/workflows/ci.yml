name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install pre-commit
        run: uv pip install pre-commit

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files

  backend-tests:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: ./spotpass_backend
        run: uv sync --dev

      - name: Run tests with coverage
        working-directory: ./spotpass_backend
        run: uv run pytest --cov=. --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./spotpass_backend/coverage.xml
          flags: backend
          name: backend-coverage
        if: github.event_name == 'pull_request'

  frontend-tests:
    name: Frontend Build & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --immutable

      - name: Run TypeScript check
        working-directory: ./frontend
        run: yarn typecheck

      - name: Run ESLint
        working-directory: ./frontend
        run: yarn lint

      - name: Check formatting
        working-directory: ./frontend
        run: yarn format:check

      - name: Build
        working-directory: ./frontend
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [pre-commit, backend-tests, frontend-tests]

    steps:
      - name: All checks passed
        run: echo "✅ All quality checks passed!"
