  /api/staff/auth/login:
    post:
      tags:
      - Authentication
      summary: Staff Login
      description: Staff user login endpoint - returns access and refresh tokens
      operationId: staff_login_api_staff_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/staff/auth/refresh:
