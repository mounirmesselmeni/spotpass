  /api/staff/reservations/:
    get:
      tags:
      - Staff - Reservations
      summary: List Reservations
      description: 'List all reservations with optional filters, pagination, and sorting
        (staff only)


        - **status_filter**: Filter by reservation status

        - **page**: Page number (1-indexed), default: 1

        - **page_size**: Number of items per page (max 100), default: 20

        - **sort_by**: Sort field (datetime, client_name, guests, status, created_at),
        default: datetime

        - **sort_order**: Sort order (asc, desc), default: desc'
      operationId: list_reservations_api_staff_reservations__get
      security:
      - HTTPBearer: []
      parameters:
      - name: status_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Filter
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Keyword
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          default: datetime
          title: Sort By
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          default: desc
          title: Sort Order
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Staff - Reservations
      summary: Create Reservation
      description: 'Create a new reservation (staff only)


        This endpoint uses pessimistic locking (SELECT FOR UPDATE) to prevent race
        conditions

        when multiple staff members try to book the same table simultaneously.'
      operationId: create_reservation_api_staff_reservations__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/staff/reservations/{reservation_id}:
    get:
      tags:
      - Staff - Reservations
