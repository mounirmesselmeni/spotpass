  /api/staff/clients/:
    get:
      tags:
      - Staff - Clients
      summary: List Clients
      description: 'List all clients with pagination, sorting, and filtering (staff
        only)


        - **page**: Page number (1-indexed), default: 1

        - **page_size**: Number of items per page (max 1000), default: 20

        - **sort_by**: Sort field (name, email, phone, created_at), default: name

        - **sort_order**: Sort order (asc, desc), default: asc

        - **label_filter**: Filter by client labels (vip, blacklisted, regular). Can
        be multiple values.

        - **search**: Search query to filter clients by name, phone, or email'
      operationId: list_clients_api_staff_clients__get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          default: name
          title: Sort By
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          default: asc
          title: Sort Order
      - name: label_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Label Filter
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Staff - Clients
      summary: Create Client
      description: Create a new client (staff only)
      operationId: create_client_api_staff_clients__post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/staff/clients/{client_id}:
    get:
